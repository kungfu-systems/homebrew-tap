name: Buildchain Validate

on:
  pull_request:
  push:
    branches:
      - main
      - alpha/v0/v0.1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate .buildchain/buildchain.toml
        uses: kungfu-systems/buildchain/actions/validate-config@v4
        with:
          require-lifecycle-stages: "verify"
      - name: Require Buildchain contract lock
        shell: bash
        run: test -f .buildchain/contract-lock.json
