name: Tap Check

on:
  pull_request:
  push:
    branches:
      - main
      - alpha/v0/v0.1

permissions:
  actions: read
  contents: read
  issues: write
  id-token: write

jobs:
  check:
    uses: kungfu-systems/buildchain/.github/workflows/build.yml@v4-alpha
    with:
      buildchain-alpha-contract-lock-path: buildchain.alpha-contract-lock.json
      buildchain-stable-contract-lock-path: buildchain.contract-lock.json
      buildchain-contract-compatibility-policy: major-compatible
      buildchain-contract-drift-issue-mode: compatible-and-breaking
      runner-preset: custom
      require-trusted-event: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != 'dongkeren/homebrew-tap' }}
      platforms-json: >-
        [{"id":"linux-x64","name":"Linux x64","runner":"[\"ubuntu-24.04\"]"}]
      require-build: true
      build-command: node scripts/build-release-bundle.mjs
      release-candidate: true
      publish-channel: ${{ startsWith(github.base_ref, 'alpha/') && 'alpha' || 'none' }}
      require-verify: true
      verify-command: node --test scripts/update-managed-products.test.mjs && node scripts/check-tap.mjs
      sample-process-tree: false
      artifact-name: homebrew-tap
      artifact-name-template: "{artifact}-{platform}-{shortSha}"
      artifact-paths: |
        dist/release
        tap-manifest.json
        buildchain.alpha-contract-lock.json
        buildchain.contract-lock.json
        package.json
        Formula
        Casks
        docs
        kfd
      expected-artifacts-json: >-
        {"requiredPaths":["tap-manifest.json","buildchain.alpha-contract-lock.json","buildchain.contract-lock.json","package.json","Formula/buildchain.rb","Formula/kfd.rb","Formula/kungfu.rb","docs/MAP.md","kfd/kfd-1.witness.json","kfd/kfd-2.release-claims.json","kfd/kfd-3.witness.json"]}
